<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doritos Hangout Delivery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <section class="hero">

    <div class="hero-left">

      <div class="eyebrow">DORITOS HANGOUT DELIVERY</div>

      <h1>
        The Doritos truck is on the move.
        <span>Your house could be its next stop.</span>
      </h1>

      <p>
        Pick your vibe, book your slot, and get ready for the ultimate hangout experience delivered to your doorstep.
      </p>

      <div class="steps">

        <!-- STEP 1 -->
        <div class="card step-card active">

          <div class="step-number">01</div>
          <h2>Choose Your Vibe</h2>

          <div class="options-grid">

            <button class="option-btn selected">
              🎮 Game Night
            </button>

            <button class="option-btn">
              🎬 Movie Night
            </button>

            <button class="option-btn">
              🥳 House Party
            </button>

            <button class="option-btn">
              ⚽ Watch Party
            </button>

          </div>

        </div>

        <!-- STEP 2 -->
        <div class="card step-card">

          <div class="step-number">02</div>
          <h2>Book Your Slot</h2>

          <div class="slot-list">

            <button class="slot-btn selected">
              Friday · 7 PM
            </button>

            <button class="slot-btn">
              Saturday · 9 PM
            </button>

            <button class="slot-btn">
              Sunday · 6 PM
            </button>

          </div>

        </div>

        <!-- STEP 3 -->
        <div class="card step-card">

          <div class="step-number">03</div>
          <h2>Select Location</h2>

          <input
            type="text"
            placeholder="Enter your city"
            class="location-input"
          />

          <button class="confirm-btn">
            BOOK THE TRUCK
          </button>

        </div>

      </div>

    </div>

    <div class="hero-right">

      <div class="truck-wrapper">
        <img src="truck.jpg" alt="Truck" class="truck-image">
      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
